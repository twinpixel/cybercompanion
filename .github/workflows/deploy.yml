name: Deploy to Cloudflare

# Deploy automatico di backend (Worker/API) e frontend (Static Assets) a ogni
# push su main. Sono lo stesso Worker, quindi un solo `wrangler deploy` pubblica
# tutto. Eseguibile anche manualmente da Actions -> Run workflow.
#
# Configurazione richiesta su GitHub (Settings -> Secrets and variables -> Actions):
#
#   Secrets
#     CLOUDFLARE_API_TOKEN    token con permessi Workers Scripts:Edit + D1:Edit
#     CLOUDFLARE_ACCOUNT_ID   id dell'account Cloudflare
#     APP_PASSWORD            password condivisa per entrare nell'app
#     SESSION_SECRET          chiave HMAC dei token di sessione (openssl rand -hex 32)
#     GROQ_API_KEY            opzionali - catena LLM. Senza nessuna di queste
#     GEMINI_API_KEY          la generazione automatica funziona lo stesso,
#     OPENROUTER_API_KEY      appoggiandosi a Workers AI in coda alla catena
#     CEREBRAS_API_KEY
#     MISTRAL_API_KEY
#
#   Variables
#     D1_DATABASE_ID          id restituito da `npx wrangler d1 create cybercompanion`

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita deploy sovrapposti: l'ultimo push vince.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler.toml tiene un placeholder al posto del database_id, cosi' l'id
      # reale non finisce nel repo: lo iniettiamo dalla variable di GitHub.
      - name: Inietta il database_id di D1
        run: |
          if [ -z "${{ vars.D1_DATABASE_ID }}" ]; then
            echo "::error::La variable D1_DATABASE_ID non e' impostata. Crea il database con 'npx wrangler d1 create cybercompanion' e salva l'id in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          sed -i 's/PLACEHOLDER_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/' wrangler.toml

      - name: Applica le migrazioni D1
        run: npx wrangler d1 migrations apply cybercompanion --remote

      - name: Build bundle worker + deploy (API + frontend)
        run: npm run cf:deploy

      # I secret vanno caricati dopo il primo deploy: `wrangler secret` richiede
      # che lo script esista gia'. Le chiavi LLM sono opzionali e vengono
      # incluse solo se valorizzate su GitHub.
      - name: Sincronizza i secret sul Worker
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          node --input-type=module -e '
            import fs from "fs";
            const required = ["APP_PASSWORD", "SESSION_SECRET"];
            const optional = ["GROQ_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY", "CEREBRAS_API_KEY", "MISTRAL_API_KEY"];
            const missing = required.filter((k) => !process.env[k]);
            if (missing.length) {
              console.error(`::error::Secret GitHub mancanti: ${missing.join(", ")}`);
              process.exit(1);
            }
            const out = {};
            for (const k of [...required, ...optional]) {
              if (process.env[k]) out[k] = process.env[k];
            }
            fs.writeFileSync("secrets.json", JSON.stringify(out));
            console.log(`Carico ${Object.keys(out).length} secret: ${Object.keys(out).join(", ")}`);
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
