# Configurazione Cloudflare Worker per CyberCompanion.
# Deploy:  npm run cf:deploy     (rigenera il bundle e lo pubblica)
# Dev:     npm run cf:dev        (server locale, D1 locale, Workers AI in remoto)
#
# Prima del primo deploy autenticati una volta:  npx wrangler login

name = "cybercompanion"
main = "dist/worker.js"
compatibility_date = "2025-06-01"

# --- D1: persistenza delle schede personaggio ---
# Crea il database una volta sola con:
#   npx wrangler d1 create cybercompanion
# poi incolla qui sotto il database_id restituito dal comando.
# Applica lo schema con:  npm run db:migrate
[[d1_databases]]
binding = "DB"
database_name = "cybercompanion"
database_id = "PLACEHOLDER_DATABASE_ID"
migrations_dir = "migrations"

# Workers AI: espone il binding `env.AI`, usato come ultimo anello della
# cascade LLM per la generazione narrativa del personaggio.
[ai]
binding = "AI"

# Rate limiting nativo Cloudflare: protegge /api/generate (l'endpoint che chiama
# l'LLM) da abusi e loop. Max 20 richieste per IP ogni 60s. Il binding e'
# provisioned automaticamente da Cloudflare (nessuna risorsa da creare a mano);
# `period` accetta solo 10 o 60. namespace_id e' un id arbitrario univoco.
[[unsafe.bindings]]
name = "GENERATE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# Rate limiter separato sul login: rallenta i tentativi di indovinare la
# password condivisa. 10 tentativi per IP al minuto.
[[unsafe.bindings]]
name = "LOGIN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

# Static Assets: serve il frontend (client/) come sito statico.
# - run_worker_first: solo /api/* passa al Worker; tutto il resto e' statico.
# - not_found_handling SPA: le rotte sconosciute ricadono su index.html.
# Gli asset statici sono gratis e illimitati (non consumano richieste Worker).
[assets]
directory = "./client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Segreti da impostare con:  npx wrangler secret put <NOME>
#   APP_PASSWORD       — password unica condivisa per accedere all'app
#   SESSION_SECRET     — chiave HMAC per firmare i token di sessione
#
# Chiavi dei provider LLM, tutte facoltative. Senza nessuna la generazione
# automatica funziona lo stesso: in coda alla catena c'e' Workers AI, che usa il
# binding qui sopra e non ha chiavi da gestire.
#   GROQ_API_KEY       — https://console.groq.com/keys
#   GEMINI_API_KEY     — https://aistudio.google.com/apikey
#   OPENROUTER_API_KEY — https://openrouter.ai/keys
#   CEREBRAS_API_KEY   — https://cloud.cerebras.ai
#   MISTRAL_API_KEY    — https://console.mistral.ai/api-keys

[vars]
# Ordine della catena LLM: si prova il primo, e chi non ha la chiave configurata
# viene saltato senza pagare l'errore. In fondo Workers AI, che non si esaurisce.
LLM_PROVIDERS = "groq,gemini,openrouter,cerebras,mistral,workers-ai"

# Modelli per provider. I valori di default stanno in server/llm/catalog.js e
# vanno bene cosi'; queste righe servono quando un provider ritira un modello.
# Se arriva un 404 o un 400 "modello rifiutato", si cambia qui, non nel codice.
GROQ_MODEL = "qwen/qwen3.6-27b"
# gemini-2.0-flash e' stato spento il 1 giugno 2026 e 2.5-flash e' chiusa alle
# nuove chiavi: il bersaglio di migrazione indicato da Google e' la 3.6.
GEMINI_MODEL = "gemini-3.6-flash"
OPENROUTER_MODEL = "openrouter/free"
CEREBRAS_MODEL = "gpt-oss-120b"
MISTRAL_MODEL = "mistral-small-latest"
# Workers AI, ultimo anello: 70B quantizzato per velocita', piano gratuito.
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Un provider che fallisce troppe volte di fila va in panchina per qualche
# minuto, invece di far pagare a ogni generazione il suo timeout o il suo 429.
LLM_SKIP_AFTER_FAILURES = "3"
LLM_SKIP_FOR_MINUTES = "10"
LLM_TIMEOUT_MS = "60000"
LLM_TEMPERATURE = "0.9"
LLM_MAX_TOKENS = "1200"

# Durata del token di sessione, in ore.
SESSION_TTL_HOURS = "720"

# Log in dashboard: Workers & Pages -> cybercompanion -> Observability
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true
